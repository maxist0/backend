[project]
name = "api"
version = "1.0.0"
description = "API Application"
requires-python = ">=3.14"
dependencies = [
    # Lower bounds = the versions verified in review step 1.4 (2026-11-16).
    "fastapi>=0.163.1",
    "starlette>=1.10.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic[email]>=2.14.3",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "itsdangerous>=2.2.0",
    "prometheus-client>=0.26.0",
    "pyjwt[crypto]>=2.15.1",
    "argon2-cffi>=25.1.0",
    "redis>=8.1.0",
    # SQLAlchemy 2.1 installs greenlet only through the [asyncio] extra.
    "sqlalchemy[asyncio]>=2.1.8",
    "greenlet>=3.5.6",
    "alembic>=1.20.1",
    "psycopg[binary]>=3.3.9",
    "structlog>=26.1.0",
    "rich>=15.0.0",
    "fastapi-mail>=1.6.8",
    # Imported directly by core/mail.py (template rendering); fastapi-mail also
    # pulls it in, but a direct import needs a direct dependency.
    "jinja2>=3.1.6",
    "taskiq>=0.13.0",
    "taskiq-redis>=1.2.4",
    "cashews>=7.6.0",
    "sqladmin>=0.32.0",
]

[build-system]
# uv's own build backend, bounded above as uv recommends
# (https://docs.astral.sh/uv/concepts/build-backend/, checked 2026-11-16).
# The lower bound admits the uv used locally (0.11.7), so uv builds with its
# built-in backend; sdists from uv_build 0.13 cannot be unpacked by uv 0.11.
requires = ["uv_build>=0.11.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Distribution "api", import package "app" in src/app/ (src layout).
module-name = "app"
module-root = "src"

[tool.uv]
# `uv sync` installs the full dev toolchain (test + lint); images use --no-dev.
default-groups = ["dev"]
# Security floors for transitive dependencies (review 2026-11, H15). These do not
# add the packages as direct dependencies; they only bound the resolver.
constraint-dependencies = [
    "aiosmtplib>=5.1.3",
    # On the login path (Argon2 offloading via anyio.to_thread); GHSA-5p39-cfhj-2xmp,
    # GHSA-82r6-8w77-94w6 fixed in 4.14.2.
    "anyio>=4.14.2",
    "certifi>=2026.10.18",
    "cryptography>=50.0.0",
    # Reachable via EmailStr (email-validator -> idna) on public endpoints.
    "idna>=3.15",
    # Step 1.4: fixed-in versions of the advisories `uv audit` reported on the
    # previous lock (2026-11-16). Installed at runtime but not on a request
    # path unless noted.
    # taskiq -> aiohttp (+ multidict); the Redis broker does not use aiohttp.
    "aiohttp>=3.14.4",
    "multidict>=6.9.1",
    # email-validator -> dnspython; used only for deliverability checks (off).
    "dnspython>=2.9.2",
    # alembic -> mako; renders new revision files (developer machines).
    "mako>=1.4.2",
    # rich -> pygments; console tracebacks in dev.
    "pygments>=2.20.0",
    # testcontainers -> docker -> requests -> urllib3 (dev group only).
    "requests>=2.33.0",
    "urllib3>=2.8.0",
]

[dependency-groups]
# PEP 735 groups. None of them is installed in the runtime image (uv sync --no-dev).
test = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "testcontainers[postgres]>=4.15.0",
    # fastapi.testclient.TestClient (Starlette >= 1.x) prefers httpx2 and
    # deprecates httpx; the app itself imports neither.
    "httpx2>=2.16.2",
    "time-machine>=3.6.0",
]
lint = [
    # Exact pin: ruff adds rules and changes defaults in minor releases, so a
    # new version is an explicit lint-config change, not a side effect of a relock.
    "ruff==0.17.5",
    "mypy>=1.19.1",
    # Informational only (open decision D6); mypy is the gate.
    "ty>=0.0.104",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    # `fastapi dev` / `fastapi run` for local use (reads [tool.fastapi]). Plain
    # fastapi-cli, not fastapi[standard]: that extra also pulls
    # fastapi-cloud-cli, fastar and pydantic-extra-types. Images start via run.py.
    "fastapi-cli>=0.0.34",
]

[tool.fastapi]
# Import string for `fastapi dev` / `fastapi run` (requires ENVIRONMENT).
entrypoint = "app.main:app"

[tool.ruff]
target-version = "py314"
line-length = 88
# First-party roots for isort. Not ".": the root's alembic/ directory would
# shadow the alembic package.
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "S", "ASYNC", "N", "D", "ANN", "RUF", "PL",
    "PT", "SIM", "T20", "ERA", "TRY", "FAST", "C4", "DTZ", "EM", "LOG", "G",
    "PTH", "RET", "ARG", "TC", "BLE", "FBT", "A", "ISC", "PIE", "PERF", "FURB",
    "SLF", "TID", "ICN", "INP", "PGH",
]

ignore = [
    # Google style documents constructor arguments in the class docstring
    # (Napoleon's Google example: one place, not both); the classes here do.
    "D107",
    # The `AppError` family passes the RFC 9457 `detail` of each occurrence
    # at the raise site (ADR 0002), and a Pydantic validator's ValueError
    # text is the client's 422 message. A class per message (TRY003) or a
    # `msg` variable before every raise (EM101, EM102) adds lines, not
    # clarity; the traceback duplication EM avoids does not arise for
    # handled errors.
    "TRY003", "EM101", "EM102",
    # TRY400 asks for `logger.exception`, which logs the exception message
    # and traceback. The security rules forbid that (database and SMTP
    # errors quote personal data): handlers log `error_type` or use
    # `log_unexpected_error`.
    "TRY400",
    # TC001-TC003 move imports used only in annotations under
    # `if TYPE_CHECKING:`. FastAPI, Pydantic, SQLAlchemy and taskiq resolve
    # annotations at runtime, also with deferred annotations (PEP 649). Ruff
    # recognises route decorators and model base classes, but not a plain
    # dependency function: FastAPI then falls back to a ForwardRef, drops
    # the `Depends` metadata and fails on the first request, not at import.
    # The only gain is import time. TC004-TC010 stay on.
    "TC001", "TC002", "TC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",     # pytest asserts are the test mechanism
    # A test's module docstring states what it covers; the test names say
    # the rest (owner decision 2026-11-18).
    "D101", "D102", "D103", "D107",
    "PLR2004",  # expected values in assertions are the point of a test
    "S105", "S106",  # fixed test credentials, never real secrets
]
"alembic/**" = [
    "INP001",  # Alembic loads env.py and revisions by path; not packages
]
"alembic/versions/**" = [
    "D103",    # upgrade()/downgrade() are Alembic's fixed entry points
    "D415",    # the first docstring line is the revision message
    "S608",    # DDL built from fixed enum labels in the file, no input
]
# Applied migration written with the old template; applied migrations are
# never edited (AGENTS.md, Database and migrations).
"alembic/versions/20260226_2120_37a0d49f8bbc_add_auth_user_tables.py" = [
    "I001", "UP007", "UP035",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["tests"]

[tool.ruff.lint.pep8-naming]
# The core's HTTP error classes are named after their status (ADR 0002);
# module errors keep the `Error` suffix.
extend-ignore-names = [
    "BadRequest", "Unauthorized", "Forbidden", "NotFound", "Conflict",
]

[tool.ruff.lint.pylint]
# Services take the unit of work, the domain values and the audit context
# (`request`, an option) as plain parameters instead of a parameter object.
max-args = 7

[tool.ruff.lint.flake8-bugbear]
# taskiq's documented way to inject a dependency is a `TaskiqDepends()`
# default; it is evaluated once and never mutated.
extend-immutable-calls = ["taskiq.TaskiqDepends"]

[tool.ruff.lint.flake8-boolean-trap]
# SQLAlchemy's API takes the attribute value positionally.
extend-allowed-calls = ["sqlalchemy.orm.attributes.set_committed_value"]

[tool.mypy]
python_version = "3.14"
strict = true
# "tests" joins once the tests are fully annotated.
files = ["src"]
# Beyond strict: every `# type: ignore` names its error code (house rule),
# and calls to APIs marked deprecated (PEP 702) fail like deprecation
# warnings do in pytest.
enable_error_code = ["ignore-without-code", "deprecated"]

[tool.pytest.ini_options]
# The coverage threshold lives only in [tool.coverage.report].fail_under.
addopts = "-v -ra --tb=short --cov=app --cov-report=term-missing"
markers = [
    "auth: tests related to authentication and authorization",
    "users: tests for user management",
    "unit: pure logic, no Docker (tests/unit)",
    "integration: HTTP against Postgres and Redis Testcontainers (tests/integration)",
    "root: test root endpoint and basic app functionality",
]
# Later entries take precedence over earlier ones, so the targeted ignores sit
# below the errors. There is no blanket ignore: a new deprecation (ours, a
# dependency's, or Python's) fails the run and has to be fixed or listed here
# with a reason and an exit condition.
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
    "error::RuntimeWarning",
    # FastAPI and Starlette deprecations derive from UserWarning, not from
    # DeprecationWarning, so the first line does not cover them (step 1.4).
    "error::fastapi.exceptions.FastAPIDeprecationWarning",
    "error::starlette.exceptions.StarletteDeprecationWarning",
    # cashews 7.6.0 (latest on 2026-11-16) still calls the deprecated redis-py
    # Redis.close() in backends/redis/backend.py when the cache (`close_cache`) shuts
    # down. Upstream; the app's own redis client uses aclose(). Remove together
    # with tests/integration/core/test_upgrade_libraries.py::TestRedisPy8::
    # test_cashews_still_calls_the_deprecated_redis_close once that test fails.
    "ignore:Call to deprecated close:DeprecationWarning:cashews",
]

[tool.coverage.run]
# Import package name, not a path: measures src/app via the editable install.
source_pkgs = ["app"]
branch = true
parallel = false
# SQLAlchemy's async layer runs DB calls inside greenlets; without "greenlet"
# lines executed there are reported as missed. "thread" covers the TestClient
# portal and anyio worker threads.
concurrency = ["greenlet", "thread"]
data_file = ".coverage"

[tool.coverage.report]
# exclude_also keeps coverage's default "pragma: no cover" pattern.
exclude_also = [
    # abstract/protocol methods
    "raise NotImplementedError",
    "@abstractmethod",
    # type checking only blocks
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    # defensive programming
    "raise AssertionError",
    # a statement consisting only of `pass` (anchored: must not match "password")
    '^\s*pass\s*$',
    # main guard
    'if __name__ == "__main__":',
]
skip_empty = true                 # ignore files with no executable lines
skip_covered = false
fail_under = 85                   # honest measured total, rounded down (review 2026-11, H14)
precision = 2
show_missing = true
sort = "cover"

[tool.coverage.html]
directory = "htmlcov"
title = "My Project Coverage"
skip_covered = true
skip_empty = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.json]
output = "coverage.json"
pretty_print = true
