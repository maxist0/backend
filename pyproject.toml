[project]
name = "api"
version = "1.0.0"
description = "API Application"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.0.0",
    "prometheus-client>=0.21.0",
    "pyjwt[crypto]>=2.10.0",
    "argon2-cffi>=23.1.0",
    "redis>=5.0.0",
    "pytest>=9.0.2",
    "httpx>=0.28.1",
    "sqlalchemy[asyncio]>=2.0.49",
    "asyncpg>=0.31.0",
    "alembic>=1.18.4",
    "greenlet>=3.1.0",
    "structlog>=25.0.0",
    "rich>=13.0.0",
    "opentelemetry-api>=1.31.0",
    "opentelemetry-exporter-otlp-proto-http>=1.31.0",
    "python-multipart>=0.0.22",
    "opentelemetry-exporter-otlp>=1.31.0",
    "opentelemetry-sdk>=1.31.0",
    "testcontainers[postgres]>=4.14.1",
    "psycopg[binary]>=3.3.3",
    "pytest-cov>=7.0.0",
    "fastapi-mail>=1.6.2",
    "taskiq>=0.12.2",
    "taskiq-redis>=1.2.2",
    "mypy>=1.19.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "testcontainers[postgres]>=4.14.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "ruff>=0.15.0",
]
[[tool.mypy.overrides]]
module = "redis.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-v -ra --tb=short --cov=src --cov-report=term-missing --cov-fail-under=80"
markers = [
    "auth: tests related to authentication and authorization",
    "users: tests for user management",
    "unit: isolated logic tests",
    "root: test root endpoint and basic app functionality",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:Unverified HTTPS request",
    "error::RuntimeWarning",
]

[tool.coverage.run]
source = ["src"]
branch = true
parallel = false 
concurrency = ["thread"]
omit = [
    "src/common/logging.py",
    "src/main.py",
    "*/__init__.py",
]
include = [
    "src/*",
]
data_file = ".coverage"           # where to store coverage data



[tool.coverage.report]
exclude_lines = [
    # default pragmas
    "pragma: no cover",
    # abstract/protocol methods
    "raise NotImplementedError",
    "@abstractmethod",
    # type checking only blocks
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    # defensive programming
    "raise AssertionError",
    # unreachable
    "pass",
    # main guard
    'if __name__ == "__main__":',
]
skip_empty = true                 # ignore files with no executable lines
skip_covered = false              # hide 100% covered files from report
fail_under = 85                  # fail if total coverage below this %
precision = 2                     # decimal places in percentages
show_missing = true               # show missing line numbers
sort = "cover"                    # sort by: "name", "stmts", "miss", "cover"

[tool.coverage.html]
directory = "htmlcov"
title = "My Project Coverage"
skip_covered = true
skip_empty = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.json]
output = "coverage.json"
pretty_print = true
