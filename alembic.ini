# alembic.ini – Alembic configuration file

[alembic]
# Path to the alembic directory (relative to this file)
script_location = alembic

# Template for generating migration filenames
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for generated file timestamps
timezone = UTC

# Every new revision is lint-fixed and formatted with the project's pinned
# ruff. The "module" runner (Alembic >= 1.16.3) runs `python -m ruff` with
# the interpreter that runs Alembic, so the same lines work on Windows and
# Linux. Fixes first (import order, modern typing), then the formatter.
# Unused imports are kept: a hand-written revision needs `op` and `sa` next.
[post_write_hooks]
hooks = ruff_fix, ruff_format
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix --unfixable F401 --quiet REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format --quiet REVISION_SCRIPT_FILENAME

# Log configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
