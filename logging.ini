# logging.ini
# Console handler and formatters only.
# File handlers are configured programmatically based on LOG_DIR from .env

[loggers]
keys=root,src,uvicorn,uvicorn.error,uvicorn.access

[handlers]
keys=consoleHandler

[formatters]
keys=standard,detailed

# ============== LOGGERS ==============

[logger_root]
level=INFO
handlers=consoleHandler

[logger_src]
level=DEBUG
handlers=consoleHandler
qualname=src
propagate=0

[logger_uvicorn]
level=INFO
handlers=consoleHandler
qualname=uvicorn
propagate=0

[logger_uvicorn.error]
level=INFO
handlers=consoleHandler
qualname=uvicorn.error
propagate=0

[logger_uvicorn.access]
level=INFO
handlers=consoleHandler
qualname=uvicorn.access
propagate=0

# ============== HANDLERS ==============

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=standard
args=(sys.stdout,)

# ============== FORMATTERS ==============

[formatter_standard]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S

[formatter_detailed]
format=%(asctime)s - %(name)s - %(levelname)s - %(filename)s:%(lineno)d - %(funcName)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S